# CORS for terracotta tile responses (referenced as ollebo-terracotta-cors@kubernetescrd)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: terracotta-cors
  namespace: ollebo
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - OPTIONS
    # Credentialed CORS forbids "*": these tiles are fetched with
    # crossOrigin: 'use-credentials' (ollebo-maps privateMaps.ts), so the
    # response must echo one exact origin and allow credentials. Keep this list
    # in sync with api/code/start.py, dw/src/plugins/cors.js and
    # maps-proxy/code/app.py -- all four are independent allowlists.
    accessControlAllowOriginList:
      - https://dash.ollebo.com
      - https://www.ollebo.com
      - https://ollebo.com
      - https://maps.ollebo.com
      # northamlin.com (the US site) is served by this same maps-proxy and the
      # same terracotta under maps.northamlin.com. One Middleware covers both
      # hostnames because it is attached per-route, and the allowlist is keyed
      # on the CALLER's origin, not on which host answered.
      - https://www.northamlin.com
      - https://northamlin.com
      - https://maps.northamlin.com
    # Dev servers against prod: vite moves between 5173/4173/3000, and
    # localhost vs 127.0.0.1 are distinct origins. Anchored -- Traefik matches
    # this regex unanchored, so a bare pattern would let
    # https://localhost.evil.com through.
    accessControlAllowOriginListRegex:
      - '^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
    accessControlAllowCredentials: true
    accessControlMaxAge: 100
    addVaryHeader: true
---
# 1-day browser/CDN cache for terracotta tiles (referenced as ollebo-terracotta-cache@kubernetescrd)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: terracotta-cache
  namespace: ollebo
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "public, max-age=86400"
