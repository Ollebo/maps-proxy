# CORS for terracotta tile responses (referenced as ollebo-terracotta-cors@kubernetescrd)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: terracotta-cors
  namespace: ollebo
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - OPTIONS
    # Credentialed CORS forbids "*": these tiles are fetched with
    # crossOrigin: 'use-credentials' (ollebo-maps privateMaps.ts), so the
    # response must echo one exact origin and allow credentials. Keep this list
    # in sync with api/code/start.py, dw/src/plugins/cors.js and
    # maps-proxy/code/app.py -- all four are independent allowlists.
    accessControlAllowOriginList:
      - https://dash.ollebo.com
      - https://dash.northamlin.com
      - https://www.ollebo.com
      - https://ollebo.com
      - https://maps.ollebo.com
      # northamlin.com (the US site) is served by this same maps-proxy and the
      # same terracotta under maps.northamlin.com. One Middleware covers both
      # hostnames because it is attached per-route, and the allowlist is keyed
      # on the CALLER's origin, not on which host answered.
      - https://www.northamlin.com
      - https://northamlin.com
      - https://maps.northamlin.com
    # Dev servers against prod: vite moves between 5173/4173/3000, and
    # localhost vs 127.0.0.1 are distinct origins. Anchored -- Traefik matches
    # this regex unanchored, so a bare pattern would let
    # https://localhost.evil.com through.
    accessControlAllowOriginListRegex:
      - '^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
    accessControlAllowCredentials: true
    accessControlMaxAge: 100
    addVaryHeader: true
---
# --- spridningstillstand.md: terracotta is never reachable without a gate ---
#
# Private (full-resolution) tiles: forwardAuth asks maps-proxy whether the
# caller is a member of the space in the path, then /private-tiles is stripped
# and the request goes to the PRIVATE terracotta. Never cached by shared caches.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: private-tiles-auth
  namespace: ollebo
spec:
  forwardAuth:
    address: http://{{ .Values.name }}.ollebo.svc.cluster.local:8080/auth/tiles
    trustForwardHeader: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: private-tiles-strip
  namespace: ollebo
spec:
  stripPrefix:
    prefixes:
      - /private-tiles
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: private-tiles-cache
  namespace: ollebo
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "private, no-store"
---
# Public (coarse 0.6 m) tiles: forwardAuth enforces the per-dataset max public
# zoom and a query-parameter allowlist, then /public is stripped and the request
# goes to the PUBLIC terracotta (public catalog only).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-tiles-gate
  namespace: ollebo
spec:
  forwardAuth:
    address: http://{{ .Values.name }}.ollebo.svc.cluster.local:8080/auth/public-tile
    trustForwardHeader: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-tiles-strip
  namespace: ollebo
spec:
  stripPrefix:
    prefixes:
      - /public
---
# Short public cache: an unpublished map must disappear from browsers and any
# intermediate cache quickly (policy 5.5). Was 1 day.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-tiles-cache
  namespace: ollebo
spec:
  headers:
    customResponseHeaders:
      Cache-Control: "public, max-age=3600"
