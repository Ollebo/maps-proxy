apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.name }}
  name: {{ .Values.name }}
  namespace: ollebo
spec:
  ports:
  - name: flask
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: {{ .Values.name }}
  sessionAffinity: None
  type: ClusterIP
---
# Source: ollebo-map/templates/map.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: ollebo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
        - image: ollebo/maps-proxy:{{ .Values.image.tag }}
          name: proxy
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: S3_ENDPOINT
              value: hel1.your-objectstorage.com
            - name: AWS_S3_FILE_BUCKET
              value: ollebo-maps
            - name: AWS_S3_PRIVATE_BUCKET
              value: ollebo-private-maps
            - name: AWS_S3_MODELS_BUCKET
              value: map-storage
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ollebo
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ollebo
                  key: AWS_SECRET_ACCESS_KEY
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: OIDC_DISCOVERY_URL
              value: https://auth.ollebo.com/realms/master/.well-known/openid-configuration
            - name: OIDC_COOKIE_NAME
              value: access_token
            # Vector tiles for the maps we host ourselves. maps-proxy fronts
            # martin so /<layer>/{z}/{x}/{y}.pbf stays on maps.ollebo.com and
            # keeps this app's credentialed CORS -- martin itself is ClusterIP
            # only and is never reachable from outside.
            - name: MARTIN_URL
              value: http://martin:3000
            # Rendered tiles are cached back into the public bucket under
            # tiles/<layer>/v<version>/... . The version in the key means a
            # re-import invalidates a layer without a purge.
            - name: TILE_CACHE_BUCKET
              value: ollebo-maps
          volumeMounts:
            # /file_cache was the container's writable layer: unbounded, and only
            # ever emptied by the (unauthenticated) /cache/clear/ route. Bounded
            # here so a large model or a busy tile layer cannot fill the node.
            - name: file-cache
              mountPath: /file_cache
      volumes:
        - name: file-cache
          emptyDir:
            sizeLimit: 5Gi

