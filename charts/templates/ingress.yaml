{{/*
  Terracotta routes (spridningstillstand.md 5.3/5.6/6). Only tile endpoints are
  exposed -- /datasets, /metadata, /keys, /colormap and /compute are not routed
  at all, so the catalogs cannot be listed from outside. Each gate is a separate
  Ingress because Traefik attaches middlewares per Ingress.
    /private-tiles/{rgb,singleband}/<space>/...  -> forwardAuth (space member)
                                                  -> terracotta (private catalog)
    /public/{rgb,singleband}/...                 -> forwardAuth (maxzoom gate)
                                                  -> terracotta-public
  Listed once and reused per hostname: a route added for one brand but not the
  other is a bug that only shows up as a 404 on the forgotten site.
*/}}
{{- define "maps-proxy.privateTilePaths" -}}
{{- range list "/private-tiles/rgb" "/private-tiles/singleband" }}
        - backend:
            service:
              name: terracotta
              port:
                number: 5000
          path: {{ . }}
          pathType: Prefix
{{- end }}
{{- end -}}
{{- define "maps-proxy.publicTilePaths" -}}
{{- range list "/public/rgb" "/public/singleband" }}
        - backend:
            service:
              name: terracotta-public
              port:
                number: 5000
          path: {{ . }}
          pathType: Prefix
{{- end }}
{{- end -}}
{{- range $host := list (dict "name" "ollebo-com" "host" "maps.ollebo.com" "tls" "maps-ollebo-tls") (dict "name" "northamlin-com" "host" "maps.northamlin.com" "tls" "maps-northamlin-tls") }}
---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
   name: "private-tiles-{{ $host.name }}"
   namespace: ollebo
   annotations:
      kubernetes.io/ingress.class: "traefik"
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: "ollebo-private-tiles-auth@kubernetescrd,ollebo-private-tiles-strip@kubernetescrd,ollebo-terracotta-cors@kubernetescrd,ollebo-private-tiles-cache@kubernetescrd"
spec:
  tls:
  - hosts:
    - {{ $host.host }}
    secretName: {{ $host.tls }}
  rules:
    - host: {{ $host.host }}
      http:
        paths:
{{- include "maps-proxy.privateTilePaths" $ }}
---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
   name: "public-tiles-{{ $host.name }}"
   namespace: ollebo
   annotations:
      kubernetes.io/ingress.class: "traefik"
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: "ollebo-public-tiles-gate@kubernetescrd,ollebo-public-tiles-strip@kubernetescrd,ollebo-terracotta-cors@kubernetescrd,ollebo-public-tiles-cache@kubernetescrd"
spec:
  tls:
  - hosts:
    - {{ $host.host }}
    secretName: {{ $host.tls }}
  rules:
    - host: {{ $host.host }}
      http:
        paths:
{{- include "maps-proxy.publicTilePaths" $ }}
{{- end }}
---
# maps-proxy catch-all is a SEPARATE ingress WITHOUT the terracotta-cors
# middleware: that middleware sets Access-Control-Allow-Origin: *, which both
# duplicates and invalidates the credentialed CORS maps-proxy sends for private
# maps/models (a "*" origin is illegal with credentials). maps-proxy does its
# own CORS (echoes the ollebo.com origin + allow-credentials), so this route
# must carry no CORS middleware. Owns the maps.ollebo.com cert (the open terracotta ingress that used to
# request it is gone).
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
   name: "maps-proxy-ollebo-com"
   namespace: ollebo
   annotations:
      kubernetes.io/ingress.class: "traefik"
      cert-manager.io/cluster-issuer: "http"
      kubernetes.io/tls-acme: "true"
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
  - hosts:
    - maps.ollebo.com
    secretName: maps-ollebo-tls
  rules:
    - host: maps.ollebo.com
      http:
        paths:
        - backend:
            service:
              name: {{ .Values.name }}
              port:
                number: 8080
          path: /
          pathType: Prefix
---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
   name: "private-maps-ollebo-com"
   namespace: ollebo
   annotations:
      kubernetes.io/ingress.class: "traefik"
      cert-manager.io/cluster-issuer: "http"
      kubernetes.io/tls-acme: "true"
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
  - hosts:
    - maps-private.ollebo.com
    secretName: maps-private-ollebo-tls
  rules:
    - host: maps-private.ollebo.com
      http:
        paths:
        - backend:
            service:
              name: {{ .Values.name }}
              port:
                number: 8080
          path: /
          pathType: Prefix
---
# Catch-all for maps.northamlin.com. No CORS middleware, for the same reason the
# ollebo catch-all carries none; maps-proxy answers with the caller's own origin
# and allow-credentials. Owns the maps.northamlin.com cert.
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
   name: "maps-proxy-northamlin-com"
   namespace: ollebo
   annotations:
      kubernetes.io/ingress.class: "traefik"
      cert-manager.io/cluster-issuer: "http"
      kubernetes.io/tls-acme: "true"
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
  - hosts:
    - maps.northamlin.com
    secretName: maps-northamlin-tls
  rules:
    - host: maps.northamlin.com
      http:
        paths:
        - backend:
            service:
              name: {{ .Values.name }}
              port:
                number: 8080
          path: /
          pathType: Prefix
